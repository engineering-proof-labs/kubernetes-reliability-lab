apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-api
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: reliability-api
    app.kubernetes.io/part-of: kubernetes-reliability-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: reliability-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliability-api
        app.kubernetes.io/part-of: kubernetes-reliability-lab
    spec:
      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: __VERSION__
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
