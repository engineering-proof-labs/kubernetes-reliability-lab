apiVersion: v1
kind: Service
metadata:
  name: reliability-api
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: reliability-api
    app.kubernetes.io/part-of: kubernetes-reliability-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: reliability-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
